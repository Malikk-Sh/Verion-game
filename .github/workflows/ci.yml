name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
  browser:
    name: browser (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [gameplay, production, models]
    env:
      VIREON_VERIFY_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        if: matrix.suite != 'models'
      - run: node tools/prepare_ci_browser.mjs
      - run: npm run verify:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-artifacts-${{ matrix.suite }}
          path: artifacts/${{ matrix.suite }}/
          if-no-files-found: ignore
